services:
  db:
    image: postgres:16-alpine
    container_name: chalarot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chalarot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chalarot}
      POSTGRES_DB: ${POSTGRES_DB:-chalarot}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chalarot} -d ${POSTGRES_DB:-chalarot}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: chalarot-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-chalarot}:${POSTGRES_PASSWORD:-chalarot}@db:5432/${POSTGRES_DB:-chalarot}
      API_PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: chalarot-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
