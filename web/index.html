<!DOCTYPE html>
<html lang="bn">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Chaler Aroot</title>
    <style>
      @font-face {
        font-family: 'PurnoPran';
        src: url('/LiPurnoPran.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'PurnoPran';
        src: url('/LiPurnoPran-Italic.ttf') format('truetype');
        font-weight: normal;
        font-style: italic;
        font-display: swap;
      }
      @font-face {
        font-family: 'PurnoPran';
        src: url('/LiPurnoPran.ttf') format('truetype');
        font-weight: bold;
        font-style: normal;
        font-display: swap;
      }

      /* Base reset & full-height styling */
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        font-family: 'PurnoPran', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
      }

      body {
        overflow: hidden;
      }

      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }

      /* Apply PurnoPran globally to all typography elements and inputs */
      *, *::before, *::after, input, button, textarea, select {
        font-family: 'PurnoPran', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root"></div>
  </body>
</html>
